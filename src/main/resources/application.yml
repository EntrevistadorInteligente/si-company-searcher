spring:
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/analizador_empresa}
      auto-index-creation: true
  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: whatsapp-webhook-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.entrevistador.analizadorempresa.domain.model

kafka:
  topic:
    whatsapp:
      incoming: whatsapp.incoming
      batched: whatsapp.batched
  topic-empresa-listener: empresa.listener

# Configuración del agregador
aggregator:
  window:
    seconds: ${AGGREGATOR_WINDOW_SECONDS:30}

server:
  port: ${PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

logging:
  level:
    com.entrevistador.analizadorempresa: INFO
    org.springframework.data.mongodb.core.MongoTemplate: INFO
    org.springframework.kafka: INFO 